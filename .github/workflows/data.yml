# Keeps builds current: collects ranked games through the patch, rebuilds every rank bracket, and
# publishes to GitHub Pages, where the app reads them.
#
# Collected games are kept as encrypted assets on a "data-<patch>" release (one per bracket, see
# pipeline/data-release.sh), so each run picks up where the last one stopped and the raw per-game
# records stay private. A new patch starts a new release.

name: Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes to collect before building
        default: '300'

# One run at a time; a scheduled run waits for the previous one instead of fighting it for the API key.
concurrency:
  group: data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      DATA_KEY: ${{ secrets.DATA_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Current patch
        id: patch
        run: |
          version=$(curl -fsS https://ddragon.leagueoflegends.com/api/versions.json | jq -r '.[0]')
          echo "patch=$(echo "$version" | cut -d. -f1-2)" >> "$GITHUB_OUTPUT"

      - name: Restore collected games
        run: bash pipeline/data-release.sh restore "${{ steps.patch.outputs.patch }}"

      - name: Collect
        # Collection stopping early (key expired, Riot outage) shouldn't block publishing what we have.
        continue-on-error: true
        run: node pipeline/src/collect.mjs --per-region 4000 --minutes "${{ inputs.minutes || '300' }}"

      - name: Save collected games
        run: bash pipeline/data-release.sh save "${{ steps.patch.outputs.patch }}"

      - name: Build
        run: |
          npx tsx pipeline/src/build.ts --out site/builds
          # Static files served at the site root, e.g. riot.txt for Riot's product URL verification.
          cp -r pages/. site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
