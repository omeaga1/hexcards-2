[package]
name = "hexcards"
version = "0.2.0"
description = "Hex Cards: League of Legends builds and client import"
edition = "2024"

[lib]
name = "hexcards_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
native-tls = "0.2"
futures-util = "0.3"
sysinfo = "0.39"
base64 = "0.23"
thiserror = "2"
tauri-plugin-process = "2"

# Desktop only: checks GitHub Releases for signed updates.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
